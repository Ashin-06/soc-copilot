[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-copilot"
version = "1.0.0"
description = "SOC copilot for a digital bank: detection, security-fraud correlation, privacy-scrubbed AI triage and two-person playbooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "pandas>=2.0,<3",  # the benchmark and real-data runs used pandas 2
    "tzdata>=2024.1",  # zone database for staff working hours on Windows
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
dashboard = ["streamlit>=1.50"]

[project.scripts]
soccopilot = "soccopilot.__main__:main"

[tool.setuptools]
packages = ["soccopilot", "soccopilot.ingest"]

[tool.setuptools.package-data]
soccopilot = ["migrations/*.sql", "rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["soccopilot"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905", "E731"]  # Depends() defaults are FastAPI's idiom; zip(strict=) and named lambdas are style
