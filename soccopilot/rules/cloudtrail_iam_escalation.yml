title: CloudTrail Access Key or Policy Persistence
id: SIGMA-BANK-005
status: stable
description: Detects persistence through new IAM access keys, console passwords or directly attached policies.
logsource:
  category: iam
  service: cloudtrail
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098.001
detection:
  selection:
    source: cloudtrail
    event_action:
      - CreateAccessKey
      - AttachUserPolicy
      - PutUserPolicy
      - AttachRolePolicy
      - CreateLoginProfile
      - UpdateLoginProfile
    event_outcome: success
  filter:
    user: svc-backup-nightly
  condition: selection and not filter
level: high
falsepositives:
  - Approved emergency break-glass IAM maintenance
